<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AstroPHP 3D Mission Flight & Constellation Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    #telemetryHud {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 14px 18px;
      background: rgba(10, 15, 25, 0.88);
      border: 1px solid rgba(0, 220, 255, 0.4);
      border-radius: 6px;
      color: #00e5ff;
      font-family: 'SF Mono', Monaco, Inconsolata, monospace;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      pointer-events: auto;
      z-index: 999;
    }
    #telemetryHud .hud-title {
      font-weight: bold;
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(0, 220, 255, 0.25);
      padding-bottom: 4px;
    }
    #telemetryHud .val { color: #ffffff; }
    .toggle-btn {
      margin-top: 10px;
      background: rgba(0, 220, 255, 0.2);
      border: 1px solid #00e5ff;
      color: #fff;
      padding: 5px 10px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      width: 100%;
    }
    .toggle-btn:hover { background: rgba(0, 220, 255, 0.4); }
  </style>
</head>
<body>
  <div id="telemetryHud">
    <div class="hud-title">ASTRO-PHP MISSION HUD</div>
    <div>VIEW: <span id="currentView" class="val">Single Spacecraft (LEO-01)</span></div>
    <div>UTC EPOCH: <span id="hudEpoch" class="val">--</span></div>
    <div>ALTITUDE: <span id="hudAlt" class="val">--</span> km</div>
    <div>SUB-LAT: <span id="hudLat" class="val">--</span>°</div>
    <div>SUB-LON: <span id="hudLon" class="val">--</span>°</div>
    <button class="toggle-btn" id="toggleMode">Switch to Walker-Delta Constellation</button>
  </div>
  <div id="cesiumContainer"></div>
  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      shouldAnimate: true,
      timeline: true,
      animation: true,
      baseLayerPicker: false,
      geocoder: false,
      scene3DOnly: true
    });

    Cesium.ArcGisMapServerImageryProvider.fromUrl(
      'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
    ).then(provider => {
      viewer.imageryLayers.addImageryProvider(provider);
    });

    let currentSource = null;
    let satEntity = null;
    let isConstellationMode = false;

    function loadDataset(filename, isConstellation) {
      if (currentSource) {
        viewer.dataSources.remove(currentSource);
      }
      fetch(filename)
        .then(res => res.json())
        .then(czml => viewer.dataSources.add(Cesium.CzmlDataSource.load(czml)))
        .then(dataSource => {
          currentSource = dataSource;
          viewer.zoomTo(dataSource);
          satEntity = dataSource.entities.getById('SAT-LEO-01') || dataSource.entities.getById('SAT-P01-S01');
          document.getElementById('currentView').innerText = isConstellation ? 'Walker 12/3/1 Mesh' : 'SAT-LEO-01';
        })
        .catch(err => console.error("Error loading " + filename + ":", err));
    }

    loadDataset('orbit.czml', false);

    document.getElementById('toggleMode').addEventListener('click', () => {
      isConstellationMode = !isConstellationMode;
      document.getElementById('toggleMode').innerText = isConstellationMode ? 'Switch to Single Satellite' : 'Switch to Walker Constellation';
      loadDataset(isConstellationMode ? 'constellation.czml' : 'orbit.czml', isConstellationMode);
    });

    viewer.scene.postRender.addEventListener(() => {
      if (!satEntity) return;
      const time = viewer.clock.currentTime;
      const position = satEntity.position.getValue(time);
      if (position) {
        const carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(position);
        if (carto) {
          document.getElementById('hudEpoch').innerText = Cesium.JulianDate.toIso8601(time);
          document.getElementById('hudLat').innerText = Cesium.Math.toDegrees(carto.latitude).toFixed(3);
          document.getElementById('hudLon').innerText = Cesium.Math.toDegrees(carto.longitude).toFixed(3);
          document.getElementById('hudAlt').innerText = (carto.height / 1000.0).toFixed(2);
        }
      }
    });
  </script>

    <script>
      let eventSource = null;
      let liveSatEntity = null;
      const streamBtn = document.getElementById("stream-btn");

      if (streamBtn) {
        streamBtn.addEventListener("click", () => {
          if (eventSource) {
            eventSource.close();
            eventSource = null;
            streamBtn.textContent = "Engage Live SSE Stream";
            streamBtn.style.borderColor = "#00e5ff";
            return;
          }

          streamBtn.textContent = "Disconnect Live Stream";
          streamBtn.style.borderColor = "#ff3366";

          if (!liveSatEntity) {
            liveSatEntity = viewer.entities.add({
              id: "LIVE-SAT-LEO-01",
              name: "SAT-LEO-01 (Live Stream)",
              point: {
                pixelSize: 12,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
              },
              label: {
                text: "LIVE SAT-LEO-01",
                font: "11pt monospace",
                fillColor: Cesium.Color.RED,
                pixelOffset: new Cesium.Cartesian2(0, -18),
                horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
              },
            });
          }

          eventSource = new EventSource("/public/stream.php");
          eventSource.addEventListener("telemetry", (e) => {
            const data = JSON.parse(e.data);
            const pos = Cesium.Cartesian3.fromElements(
              data.positionKm.x * 1000.0,
              data.positionKm.y * 1000.0,
              data.positionKm.z * 1000.0
            );

            liveSatEntity.position = pos;

            const altEl = document.getElementById("hud-alt");
            const epochEl = document.getElementById("hud-epoch");
            if (altEl) altEl.textContent = data.positionKm.altitudeKm.toFixed(2) + " km (LIVE)";
            if (epochEl) epochEl.textContent = data.epochIso;
          });
        });
      }
    
    // Stabilize clock rate and sanitize HUD numbers
    if (typeof viewer !== "undefined" && viewer.clock) {
      viewer.clock.multiplier = 5.0; // 5x real-time for smooth, readable orbital velocity
    }

    </script>
</body>

</html>
